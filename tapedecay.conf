# PipeWire filter-chain config for Tape Decay
#
# Usage:
#   pw-filter-chain tapedecay.conf
#
# Or install to ~/.config/pipewire/filter-chain.conf.d/ for auto-load.

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Tape Decay"
            media.name        = "Tape Decay"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = tapedecay
                        plugin = tapedecay
                        label  = tapedecay
                        control = {
                            Decay = 0.1
                        }
                    }
                ]
                links = [
                    { output = "tapedecay:Output L" input = "playback_1:input_FL" }
                    { output = "tapedecay:Output R" input = "playback_1:input_FR" }
                ]
                inputs  = [ "tapedecay:Input L" "tapedecay:Input R" ]
                outputs = [ "playback_1:monitor_FL" "playback_1:monitor_FR" ]
            }
            capture.props = {
                node.name        = "tape_decay_sink"
                media.class      = Audio/Sink
                audio.channels   = 2
                audio.position   = [ FL FR ]
            }
            playback.props = {
                node.name        = "tape_decay_output"
                node.passive     = true
            }
        }
    }
]
