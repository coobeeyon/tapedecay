name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev \
            libfreetype-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxfixes-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        working-directory: juce

      - name: Build
        run: cmake --build build --config Release --parallel
        working-directory: juce

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd juce/build/TapeDecay_artefacts/Release
          for fmt in VST3 LV2 Standalone AU; do
            if [ -d "$fmt" ]; then
              zip -r "../../../../TapeDecay-${fmt}-${{ matrix.name }}.zip" "$fmt"
            fi
          done

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd juce/build/TapeDecay_artefacts/Release
          foreach ($fmt in @("VST3", "LV2", "Standalone")) {
            if (Test-Path $fmt) {
              Compress-Archive -Path $fmt -DestinationPath "../../../../TapeDecay-${fmt}-${{ matrix.name }}.zip"
            }
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.name }}
          path: TapeDecay-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: TapeDecay-*.zip
